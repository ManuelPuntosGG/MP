<!DOCTYPE html>
{% load static %}
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}MP Tech{% endblock %}</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>
        /* NUEVO: Paleta de colores Tech-Premium */
        :root {
            --primario: #09090b;
            /* Negro zinc profundo para fondos/textos principales */
            --gris-oscuro: #18181b;
            /* Gris oscuro para headers/footers */
            --fondo: #fafafa;
            /* Blanco roto para el fondo general */
            --texto: #27272a;
            /* Gris carbón para lectura suave */
            --blanco: #ffffff;
            --acento: #dc2626;
            /* Rojo tech vibrante */
            --acento-hover: #b91c1c;
            --borde: #e4e4e7;
            --verde-precio: #10b981;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--fondo);
            color: var(--texto);
            line-height: 1.6;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            margin: 0;
        }

        .contenido-principal {
            flex: 1;
        }

        /* HEADER GLOBAL MEJORADO */
        header {
            background-color: var(--primario);
            padding: 1rem 5%;
            border-bottom: 2px solid var(--acento);
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .logo-nav {
            font-size: 1.8rem;
            font-weight: 800;
            color: var(--blanco);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 10px;
            letter-spacing: -0.5px;
        }

        .logo-img {
            height: 40px;
            width: auto;
            object-fit: contain;
        }

        .nav-links {
            display: flex;
            gap: 12px;
        }

        /* ESTILO DE BOTONES DEL NAVBAR MODERNIZADO */
        .nav-links a {
            background-color: transparent;
            color: var(--blanco);
            text-decoration: none;
            padding: 8px 16px;
            border-radius: 6px;
            font-weight: 600;
            font-size: 0.95rem;
            transition: all 0.3s ease;
            border: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .nav-links a:hover {
            background-color: var(--acento);
            border-color: var(--acento);
            transform: translateY(-2px);
            /* Micro-interacción: el botón sube un poco */
        }

        /* BOTÓN WHATSAPP FLOTANTE MEJORADO */
        .whatsapp-btn-flotante {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #25D366;
            color: white;
            padding: 12px 20px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: bold;
            box-shadow: 0 10px 15px -3px rgba(37, 211, 102, 0.3);
            z-index: 100;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .whatsapp-btn-flotante:hover {
            transform: translateY(-4px) scale(1.02);
            box-shadow: 0 15px 20px -3px rgba(37, 211, 102, 0.4);
        }

        /* NUEVO: EFECTO GLOW PARA TODOS LOS INPUTS (Buscador, Formularios, etc.) */
        input:focus,
        textarea:focus,
        .form-input:focus {
            outline: none !important;
            border-color: var(--acento) !important;
            box-shadow: 0 0 0 4px rgba(220, 38, 38, 0.15) !important;
            background: var(--blanco) !important;
        }

        /* NUEVO: CLASE DE UTILIDAD PARA SOMBRAS FLOTANTES */
        /* Agrega la clase 'tarjeta-premium' a los divs de tu inicio.html o catalogo.html para este efecto */
        .tarjeta-premium {
            transition: all 0.3s ease;
        }

        .tarjeta-premium:hover {
            transform: translateY(-5px);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.05), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
        }

        /* BLOQUE PARA ESTILOS ESPECÍFICOS DE CADA PÁGINA */
        /* Ajustes para Pantallas Móviles */
        @media (max-width: 768px) {
            header {
                flex-direction: column;
                /* Pone el logo arriba y los botones abajo */
                gap: 1rem;
                padding: 1rem 5%;
                text-align: center;
            }

            .nav-links {
                width: 100%;
                flex-wrap: wrap;
                /* Si no caben los 3 botones, se bajan ordenadamente */
                justify-content: center;
                gap: 8px;
            }

            .nav-links a {
                font-size: 0.85rem;
                /* Letra un poco más pequeña en móvil */
                padding: 8px 12px;
                flex: 1 1 calc(50% - 8px);
                /* Hace que los botones se acomoden en cuadrícula */
                justify-content: center;
            }

            .logo-nav {
                font-size: 1.5rem;
            }
        }
    </style>
    {% block extra_css %}{% endblock %}
</head>

<body>
    <header>
        <a href="{% url 'inicio' %}" class="logo-nav">
            <img src="{% static 'images/logo.png' %}" alt="MP Tech" class="logo-img">
            MP Tech
        </a>
        <nav class="nav-links">
            <a href="{% url 'catalogo' %}"><i class="bi bi-cpu"></i> Catálogo</a>
            <a href="{% url 'rastrear_ticket' %}"><i class="bi bi-search"></i> Rastrear</a>
            <a href="{% url 'solicitar_reparacion' %}"><i class="bi bi-tools"></i> Solicitar Reparación</a>
        </nav>
    </header>

    <main class="contenido-principal">
        {% block content %}
        {% endblock %}
    </main>
