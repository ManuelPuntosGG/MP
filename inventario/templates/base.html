<!DOCTYPE html>
{% load static %}
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}MP Tech{% endblock %}</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>
        :root {
            --primario: #09090b;
            --gris-oscuro: #18181b;
            --fondo: #fafafa;
            --texto: #27272a;
            --blanco: #ffffff;
            --acento: #dc2626;
            --acento-hover: #b91c1c;
            --borde: #e4e4e7;
            --verde-precio: #10b981;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--fondo);
            color: var(--texto);
            line-height: 1.6;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            margin: 0;
        }

        .contenido-principal {
            flex: 1;
        }

        /* HEADER GLOBAL */
        header {
            background-color: var(--primario);
            padding: 1rem 5%;
            border-bottom: 2px solid var(--acento);
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .logo-nav {
            font-size: 1.8rem;
            font-weight: 800;
            color: var(--blanco);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 10px;
            letter-spacing: -0.5px;
        }

        .logo-img {
            height: 40px;
            width: auto;
            object-fit: contain;
        }

        .nav-links {
            display: flex;
            gap: 12px;
        }

        .nav-links a {
            background-color: transparent;
            color: var(--blanco);
            text-decoration: none;
            padding: 8px 16px;
            border-radius: 6px;
            font-weight: 600;
            font-size: 0.95rem;
            transition: all 0.3s ease;
            border: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .nav-links a:hover {
            background-color: var(--acento);
            border-color: var(--acento);
            transform: translateY(-2px);
        }

        /* BOTÓN WHATSAPP FLOTANTE */
        .whatsapp-btn-flotante {
            position: fixed;
            bottom: 25px;
            right: 25px;
            background: #25D366;
            color: white;
            padding: 14px 22px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 700;
            box-shadow: 0 10px 15px -3px rgba(37, 211, 102, 0.3);
            z-index: 1000;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1.05rem;
        }

        .whatsapp-btn-flotante:hover {
            transform: translateY(-5px) scale(1.05);
            box-shadow: 0 15px 25px -5px rgba(37, 211, 102, 0.5);
            color: white;
        }

        /* EFECTO GLOW INPUTS */
        input:focus,
        textarea:focus,
        .form-input:focus {
            outline: none !important;
            border-color: var(--acento) !important;
            box-shadow: 0 0 0 4px rgba(220, 38, 38, 0.15) !important;
            background: var(--blanco) !important;
        }

        /* SOMBRAS FLOTANTES */
        .tarjeta-premium {
            transition: all 0.3s ease;
        }

        .tarjeta-premium:hover {
            transform: translateY(-5px);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.05), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
        }

        /* ==========================================
           🌟 NUEVO: CLASES PARA ANIMACIÓN FADE-IN
           ========================================== */
        .fade-in {
            opacity: 0;
            transform: translateY(30px);
            transition: opacity 0.8s ease-out, transform 0.8s ease-out;
            will-change: opacity, transform;
        }

        .fade-in.visible {
            opacity: 1;
            transform: translateY(0);
        }

        @media (max-width: 768px) {
            header {
                flex-direction: column;
                gap: 1rem;
                padding: 1rem 5%;
                text-align: center;
            }

            .nav-links {
                width: 100%;
                flex-wrap: wrap;
                justify-content: center;
                gap: 8px;
            }

            .nav-links a {
                font-size: 0.85rem;
                padding: 8px 12px;
                flex: 1 1 calc(50% - 8px);
                justify-content: center;
            }

            .whatsapp-btn-flotante {
                bottom: 20px;
                right: 20px;
                padding: 12px;
            }
            
            /* Ocultar el texto en móviles para que solo quede el ícono redondo */
            .whatsapp-texto {
                display: none;
            }
            
            .whatsapp-btn-flotante i {
                font-size: 1.5rem;
                margin: 0;
            }
        }
    </style>
    {% block extra_css %}{% endblock %}
</head>

<body>
    <header>
        <a href="{% url 'inicio' %}" class="logo-nav">
            <img src="{% static 'images/logo.png' %}" alt="MP Tech" class="logo-img">
            MP Tech
        </a>
        <nav class="nav-links">
            <a href="{% url 'catalogo' %}"><i class="bi bi-cpu"></i> Catálogo</a>
            <a href="{% url 'rastrear_ticket' %}"><i class="bi bi-search"></i> Rastrear</a>
            <a href="{% url 'solicitar_reparacion' %}"><i class="bi bi-tools"></i> Solicitar Reparación</a>
        </nav>
    </header>

    <main class="contenido-principal">
        {% block content %}
        {% endblock %}
    </main>

    <a href="https://wa.me/584245022292" target="_blank" class="whatsapp-btn-flotante">
        <i class="bi bi-whatsapp"></i>
        <span class="whatsapp-texto">Consultar por WhatsApp</span>
    </a>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const observerOptions = {
                root: null,
                rootMargin: '0px',
                threshold: 0.15 // El elemento aparecerá cuando el 15% sea visible
            };

            const observer = new IntersectionObserver((entries, observer) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        entry.target.classList.add('visible');
                        observer.unobserve(entry.target); // Deja de observar una vez que ya apareció
                    }
                });
            }, observerOptions);

            const fadeElements = document.querySelectorAll('.fade-in');
            fadeElements.forEach(el => observer.observe(el));
        });
    </script>
</body>
</html>
