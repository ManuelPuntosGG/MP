<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ subject|default:"Notificación de MP Tech" }}</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #0f172a;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      color: #e2e8f0;
      -webkit-font-smoothing: antialiased;
    }
    .wrapper {
      width: 100%;
      table-layout: fixed;
      background-color: #0f172a;
      padding: 30px 10px;
    }
    .main {
      background-color: #1e293b;
      margin: 0 auto;
      width: 100%;
      max-width: 600px;
      border-radius: 16px;
      border: 1px solid #334155;
      overflow: hidden;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
    }
    .header {
      background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
      padding: 28px 24px;
      text-align: center;
      border-bottom: 2px solid #e11d48;
    }
    .logo-text {
      font-size: 26px;
      font-weight: 900;
      letter-spacing: 1.5px;
      color: #ffffff;
      margin: 0;
      text-transform: uppercase;
    }
    .logo-accent {
      color: #e11d48;
    }
    .tagline {
      font-size: 12px;
      color: #94a3b8;
      margin-top: 6px;
      letter-spacing: 0.5px;
    }
    .content {
      padding: 32px 28px;
    }
    h1 {
      font-size: 22px;
      font-weight: 800;
      color: #ffffff;
      margin-top: 0;
      margin-bottom: 16px;
    }
    p {
      font-size: 15px;
      line-height: 1.6;
      color: #cbd5e1;
      margin-top: 0;
      margin-bottom: 16px;
    }
    .highlight-card {
      background-color: #0f172a;
      border: 1px solid #334155;
      border-left: 4px solid #e11d48;
      border-radius: 10px;
      padding: 16px 20px;
      margin: 20px 0;
    }
    .badge {
      display: inline-block;
      padding: 6px 14px;
      font-size: 13px;
      font-weight: 700;
      border-radius: 8px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .badge-success { background-color: #065f46; color: #34d399; }
    .badge-pending { background-color: #78350f; color: #fbbf24; }
    .badge-info { background-color: #1e3a8a; color: #60a5fa; }
    .badge-danger { background-color: #881337; color: #fda4af; }
    .badge-purple { background-color: #581c87; color: #d8b4fe; }

    .code-box {
      background-color: #0f172a;
      border: 1px dashed #e11d48;
      border-radius: 12px;
      padding: 14px;
      text-align: center;
      margin: 20px 0;
    }
    .code-val {
      font-family: 'Courier New', monospace;
      font-size: 24px;
      font-weight: 900;
      color: #fb7185;
      letter-spacing: 3px;
    }

    .data-table {
      width: 100%;
      border-collapse: collapse;
      margin: 20px 0;
      font-size: 14px;
    }
    .data-table th {
      background-color: #0f172a;
      color: #94a3b8;
      font-weight: 700;
      text-align: left;
      padding: 10px 12px;
      border-bottom: 1px solid #334155;
    }
    .data-table td {
      padding: 12px;
      border-bottom: 1px solid #334155;
      color: #e2e8f0;
    }
    .data-table tr:last-child td {
      border-bottom: none;
    }

    .btn-container {
      text-align: center;
      margin: 30px 0 15px 0;
    }
    .btn {
      display: inline-block;
      background-color: #e11d48;
      color: #ffffff !important;
      text-decoration: none;
      font-weight: 800;
      font-size: 15px;
      padding: 14px 30px;
      border-radius: 12px;
      box-shadow: 0 4px 14px rgba(225, 29, 72, 0.4);
    }
    .btn:hover {
      background-color: #be123c;
    }

    .footer {
      background-color: #0f172a;
      padding: 24px;
      text-align: center;
      border-top: 1px solid #334155;
      font-size: 12px;
      color: #64748b;
    }
    .footer a {
      color: #fb7185;
      text-decoration: none;
    }
    .divider {
      height: 1px;
      background-color: #334155;
      margin: 24px 0;
    }
  </style>
</head>
<body>
  <div class="wrapper">
    <div class="main">
      <div class="header">
        <div class="logo-text">MP <span class="logo-accent">TECH</span></div>
        <div class="tagline">Tecnología, Importaciones y Servicio Técnico Especializado</div>
      </div>
      
      <div class="content">
        {% block content %}{% endblock %}
      </div>
      
      <div class="footer">
        <p style="margin-bottom: 8px; font-size: 12px; color: #94a3b8;">
          Este es un correo automático generado por el sistema de <strong>MP Tech</strong>.
        </p>
        <p style="margin: 0; font-size: 12px; color: #64748b;">
          ¿Tienes dudas? Contáctanos vía WhatsApp o respondiendo a <a href="mailto:grupomptech@gmail.com">grupomptech@gmail.com</a>
        </p>
      </div>
    </div>
  </div>
</body>
</html>
